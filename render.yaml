services:
  - type: web
    name: dr-shompa-backend
    env: node
    region: bangalore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      # Browser requests are same-origin because Express serves the frontend too.
      # No cross-origin Netlify allowlist is required for this deployment.
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    database:
      name: drshompa-db
      databaseName: drshompa
      user: drshompa-user
      plan: free
